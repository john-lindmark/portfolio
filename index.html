<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The work of John Lindmark, a Denver-based Product Design Manager."/>

  <link rel="stylesheet" href="css/styles.css">

  <!-- So Many Favicons -->
  <link rel="icon" type="image/png" href="images/favicons/favicon16.png" sizes="16x16">
  <link rel="icon" type="image/png" href="images/favicons/favicon32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="images/favicons/favicon96.png" sizes="96x96">
  <link rel="apple-touch-icon" href="images/favicons/favicon120.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/favicon180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="images/favicons/favicon152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="images/favicons/favicon167.png">

  <title>Lindmark Design</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
</head>

<body>

  <model-viewer src="models/winged-victory.glb" id="victory" alt="A 3D model of the Winged Victory of Samothrace, seen from a slowly orbiting camera" camera-orbit="-100deg 87.7deg 330m" min-camera-orbit="auto auto 0m" max-camera-orbit="auto auto 500m" field-of-view="1.74deg" min-field-of-view="1deg" max-field-of-view="auto" camera-target="-5.3m 35m 6.04m" interpolation-decay="0" shadow-intensity="1.8" exposure="1" tone-mapping="aces" environment-image="models/key-light.hdr">
  </model-viewer>

  <h1 class="logo">
    <img src="images/svg/lindmark-design-logo.svg" alt="Lindmark Design">
  </h1>

  <script>
    // Keep full resolution: by default model-viewer drops to as little as a
    // quarter-res render when frames slow down, which softens the scan detail.
    customElements.whenDefined('model-viewer').then(() => {
      customElements.get('model-viewer').minimumRenderScale = 1;
    });

    // The statue stays put; the camera circles it on a slightly tilted orbit
    // that dips lowest in front of the figure and rises behind it.
    const victory = document.getElementById('victory');

    // Start the reveal once the model is ready (or failed, so the logo still shows).
    const reveal = () => document.body.classList.add('is-loaded');
    victory.addEventListener('load', reveal, { once: true });
    victory.addEventListener('error', reveal, { once: true });

    const DEGREES_PER_SECOND = 8;
    const FRONT = -30;       // orbit angle that faces the statue head-on
    const START = -100;      // open on the statue's right wing, then swing to the front
    const BASE_PITCH = 85;   // camera angle down from straight overhead
    const TILT = 8;          // +/- swing of that angle around the orbit
    const RADIUS = '330m';   // far back on a long (1.74deg) lens for a tight crop

    function orbitAt(theta) {
      const pitch = BASE_PITCH + TILT * Math.cos((theta - FRONT) * Math.PI / 180);
      return `${theta}deg ${pitch}deg ${RADIUS}`;
    }

    // Respect the visitor's reduced-motion setting: hold the camera still.
    // Otherwise wait for the statue's fade-in to begin, so the opening view
    // really is the START angle rather than wherever the orbit had reached.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      let start;
      const step = (now) => {
        start ??= now;
        victory.cameraOrbit = orbitAt(START + (now - start) / 1000 * DEGREES_PER_SECOND % 360);
        requestAnimationFrame(step);
      };
      victory.addEventListener('animationstart', () => requestAnimationFrame(step), { once: true });
    }
  </script>

</body>

</html>
