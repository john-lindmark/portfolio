<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The work of John Lindmark, a Denver-based Product Design Manager."/>

  <link rel="stylesheet" href="css/styles.css">

  <!-- So Many Favicons -->
  <link rel="icon" type="image/png" href="images/favicons/favicon16.png" sizes="16x16">
  <link rel="icon" type="image/png" href="images/favicons/favicon32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="images/favicons/favicon96.png" sizes="96x96">
  <link rel="apple-touch-icon" href="images/favicons/favicon120.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/favicon180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="images/favicons/favicon152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="images/favicons/favicon167.png">

  <title>Lindmark Design</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
</head>

<body>

  <model-viewer src="models/winged-victory.glb" id="victory" alt="A 3D model of the Winged Victory of Samothrace, slowly turning" camera-orbit="0deg 87.7deg 330m" min-camera-orbit="auto auto 0m" max-camera-orbit="auto auto 500m" field-of-view="1.74deg" min-field-of-view="1deg" max-field-of-view="auto" camera-target="-4.3m 35m 4.31m" interpolation-decay="0" exposure="1" tone-mapping="aces" environment-image="models/key-light.hdr">
  </model-viewer>

  <h1 class="logo">
    <img src="images/svg/lindmark-design-logo.svg" alt="Lindmark Design">
  </h1>

  <script>
    // Keep full resolution: by default model-viewer drops to as little as a
    // quarter-res render when frames slow down, which softens the scan detail.
    customElements.whenDefined('model-viewer').then(() => {
      customElements.get('model-viewer').minimumRenderScale = 1;
    });

    // The camera and the key light stay put; the statue turns on its own pivot
    // (the camera target). The camera's pitch still follows the statue's angle,
    // so the view dips lowest in front of the figure and rises behind it.
    const victory = document.getElementById('victory');

    // Start the reveal once the model is ready (or failed, so the logo still shows).
    const reveal = () => document.body.classList.add('is-loaded');
    victory.addEventListener('load', reveal, { once: true });
    victory.addEventListener('error', reveal, { once: true });

    // Angles below are where the camera sits relative to the statue, as when
    // the camera orbited; the statue now turns to produce the same views.
    const DEGREES_PER_SECOND = 5;
    const FRONT = -30;       // view angle that faces the statue head-on
    const START = -100;      // open on the statue's right wing, then turn to the front
    const BASE_PITCH = 85;   // camera angle down from straight overhead
    const TILT = 8;          // +/- swing of that angle as the statue turns
    const RADIUS = '330m';   // far back on a long (1.74deg) lens for a tight crop
    const CAMERA = 0;        // fixed camera angle; the key light sits 110deg clockwise of it

    function viewAt(theta) {
      const pitch = BASE_PITCH + TILT * Math.cos((theta - FRONT) * Math.PI / 180);
      victory.cameraOrbit = `${CAMERA}deg ${pitch}deg ${RADIUS}`;
      victory.resetTurntableRotation((CAMERA - theta) * Math.PI / 180);
    }

    // Set the opening view as soon as the model is in, before it fades up.
    victory.addEventListener('load', () => viewAt(START), { once: true });

    // Respect the visitor's reduced-motion setting: hold the statue still.
    // Otherwise wait for the fade-in to begin, so the opening view really is
    // the START angle rather than wherever the turn had reached.
    // Updates are capped at ~30 a second: at this speed 30fps looks the same
    // as 60 (or 120), and every update makes the GPU redraw 2M triangles.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const FRAME_MS = 1000 / 30;
      let start, last = -Infinity;
      const step = (now) => {
        start ??= now;
        if (now - last >= FRAME_MS - 2) {
          last = now;
          viewAt(START + (now - start) / 1000 * DEGREES_PER_SECOND % 360);
        }
        requestAnimationFrame(step);
      };
      victory.addEventListener('animationstart', () => requestAnimationFrame(step), { once: true });
    }
  </script>

</body>

</html>
